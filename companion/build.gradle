plugins {
    id 'application'
}

group = 'com.flippingfriend'
version = rootProject.version

repositories { mavenCentral() }

dependencies {
    implementation project(':')
    implementation project(':core')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    // A binding, so the companion can actually say something when it fails. Without one slf4j falls
    // back to a no-op logger and every swallowed exception in a 24/7 daemon is invisible forever.
    // slf4j-simple writes to stderr, which the daemon already redirects to companion.log.err.
    implementation 'org.slf4j:slf4j-simple:1.7.36'
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

application {
    mainClass = 'com.flippingfriend.companion.CompanionMain'
}

tasks.register('shadowJar', Jar) {
    dependsOn project(':core').tasks.named('jar')
    archiveBaseName = 'flipping-friend-companion'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    dependsOn ':core:jar'
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}

tasks.named('test') {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

/**
 * Lets a probe be pointed at captured market data from the command line.
 * <p>
 * Gradle runs tests in a forked JVM that inherits none of the daemon's system properties, so a
 * -Dprobe.dir on the command line reaches the build and not the code. Forwarded explicitly, and only
 * this one property, so nothing else about the test environment depends on how the build was invoked.
 */
tasks.named('test') {
    if (System.getProperty('probe.dir') != null) {
        systemProperty 'probe.dir', System.getProperty('probe.dir')
        outputs.upToDateWhen { false }
        testLogging { showStandardStreams = true }
    }
}


/**
 * Explicitly writes a new version-one manifest beside an existing diagnostic capture.
 * This task is never attached to the normal build or test lifecycle.
 */
tasks.register('writeDiagnosticCaptureManifest', JavaExec) {
    group = 'verification'
    description = 'Writes a new diagnostic capture manifest after validating fixed capture files.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.flippingfriend.companion.DiagnosticCaptureManifestWriter'

    doFirst {
        String captureDir = System.getProperty('capture.dir')
        String captureId = System.getProperty('capture.id')

        if (captureDir == null || captureDir.trim().isEmpty()) {
            throw new GradleException('capture.dir is required')
        }
        if (captureId == null || captureId.trim().isEmpty()) {
            throw new GradleException('capture.id is required')
        }

        args captureDir, captureId
    }
}

/**
 * Explicitly verifies an authoritative manifest-backed diagnostic capture.
 * This task is never attached to the normal build or test lifecycle.
 */
tasks.register('verifyDiagnosticCapture', JavaExec) {
    group = 'verification'
    description = 'Verifies an authoritative manifest-backed diagnostic capture.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.flippingfriend.companion.DiagnosticCaptureVerifier'

    doFirst {
        String captureDir = System.getProperty('capture.dir')

        if (captureDir == null || captureDir.trim().isEmpty()) {
            throw new GradleException('capture.dir is required')
        }

        args captureDir
    }
}
