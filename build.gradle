plugins {
    id 'java'
}

group = 'com.flippingfriend'
version = '1.0.0'

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

// Pinned to the supported official RuneLite release. Update with compatibility regressions.
// The installer and launcher require a matching official release and paired JAR manifest.
ext.runeLiteVersion = '1.13.4'

dependencies {
    implementation project(':core')
    // Everything RuneLite ships is provided at runtime by the client, so it is all
    // compileOnly. That keeps the output jar to just our own classes, which is what
    // the sideloading PluginClassLoader expects.
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

java {
    // The RuneLite launcher ships a Java 11 JRE, so the plugin must be Java 11 bytecode
    // even though it is compiled here with a much newer JDK.
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.named('test') {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Match the Gson supplied by the supported RuneLite launcher, rather than masking client linkage
// failures with the standalone companion's newer dependency.
configurations.testRuntimeClasspath.resolutionStrategy.force 'com.google.code.gson:gson:2.8.5'

// Explicit visual check of the production Swing chart; never opens RuneLite or sends input.
tasks.register('renderMarketGraph', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.flippingfriend.ui.MarketGraphRender'
    doFirst {
        if (!project.hasProperty('graphCapture') || !project.hasProperty('graphOutput'))
            throw new GradleException('Use -PgraphCapture=<frozen-public-directory> -PgraphOutput=<image-directory>')
        args project.property('graphCapture'), project.property('graphOutput')
    }
}

tasks.named('jar') {
    archiveBaseName = 'osrs-flipping-friend'
    archiveVersion = ''
    manifest {
        attributes(
                'Implementation-Title': 'OSRS Flipping Friend',
                'Implementation-Version': project.version,
                'RuneLite-Api-Version': runeLiteVersion
        )
    }
    // RuneLite side-loaded jars are not dependency-aware. Package the small,
    // client-independent core beside the plugin classes.
    from project(':core').sourceSets.main.output
}

// Runs the backtester against real wiki price history without launching the game.
tasks.register('backtest', JavaExec) {
    group = 'verification'
    description = 'Replays historical Grand Exchange data through the suggestion engine.'
    classpath = project(':companion').sourceSets.main.runtimeClasspath
    mainClass = 'com.flippingfriend.companion.Backtester'
    // Lets the long-horizon model be switched off, so its contribution can be measured
    // against identical cached data rather than inferred from two different days.
    systemProperty 'flipping.backtest.noContext', (findProperty('noContext') ?: 'false')
}

// Convenience entry point for the supported local companion service.
tasks.register('companionJar') {
    group = 'application'
    description = 'Builds the local portfolio companion service.'
    dependsOn ':companion:shadowJar'
}
