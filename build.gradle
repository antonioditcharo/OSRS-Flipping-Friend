plugins {
    id 'java'
}

group = 'com.flippingfriend'
version = '1.0.0'

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

// Pinned to the client version installed on this machine (~/.runelite/repository2).
// Bump this when RuneLite updates and rebuild.
ext.runeLiteVersion = '1.12.35'

dependencies {
    implementation project(':core')
    // Everything RuneLite ships is provided at runtime by the client, so it is all
    // compileOnly. That keeps the output jar to just our own classes, which is what
    // the sideloading PluginClassLoader expects.
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

java {
    // The RuneLite launcher ships a Java 11 JRE, so the plugin must be Java 11 bytecode
    // even though it is compiled here with a much newer JDK.
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.named('test') {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('jar') {
    archiveBaseName = 'osrs-flipping-friend'
    archiveVersion = ''
    manifest {
        attributes(
                'Implementation-Title': 'OSRS Flipping Friend',
                'Implementation-Version': project.version
        )
    }
    // RuneLite side-loaded jars are not dependency-aware. Package the small,
    // client-independent core beside the plugin classes.
    from project(':core').sourceSets.main.output
}

// REMOVED 2026-09-02: the 'daemon' and 'daemonJar' tasks both pointed at
// com.flippingfriend.daemon.LearningDaemon, which has no source file anywhere in the tree.
// 'daemonJar' still *built*, because a Jar task only stamps the manifest and never checks the
// main class exists — so it produced flipping-friend-daemon.jar with no LearningDaemon inside,
// and the scheduled task installed by '3 - Background Learning.bat' died at startup with a
// ClassNotFoundException nobody was watching. That is the failure the deleted comment below
// warned about, except it was the entry point that went missing rather than :core.
//
// Not being re-added. Audit item 24 is right that the always-on learner belongs as a scheduled
// task inside CompanionMain's existing executor rather than a fourth process with its own
// ingestion path and its own cache.

// Runs the backtester against real wiki price history without launching the game.
tasks.register('backtest', JavaExec) {
    group = 'verification'
    description = 'Replays historical Grand Exchange data through the suggestion engine.'
    classpath = project(':companion').sourceSets.main.runtimeClasspath
    mainClass = 'com.flippingfriend.companion.Backtester'
    // Lets the long-horizon model be switched off, so its contribution can be measured
    // against identical cached data rather than inferred from two different days.
    systemProperty 'flipping.backtest.noContext', (findProperty('noContext') ?: 'false')
}

// Convenience entry point for the new companion service. The legacy daemon
// remains available only as a comparison baseline during migration.
tasks.register('companionJar') {
    group = 'application'
    description = 'Builds the local portfolio companion service.'
    dependsOn ':companion:shadowJar'
}
