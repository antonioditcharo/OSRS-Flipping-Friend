plugins {
    id 'java-library'
}

group = 'com.flippingfriend'
version = rootProject.version

repositories { mavenCentral() }

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

dependencies {
    // Annotations only (2KB). The plugin gets these from RuneLite at runtime; the companion does
    // not use dependency injection but the shared classes are annotated for the plugin's benefit.
    api 'javax.inject:javax.inject:1'
    api 'com.google.code.gson:gson:2.10.1'
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'org.slf4j:slf4j-api:1.7.36'
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
