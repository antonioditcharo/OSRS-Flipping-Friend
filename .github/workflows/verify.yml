name: Verify plugin and companion

on:
  push:
    branches:
      - main
      - "CoPilot's-Rebuild-from-Main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-build:
    name: Supported build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify Copilot-history ingestion
        run: python -m unittest discover -s tools/tests -v
      - name: Test and package on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./gradlew clean test jar :companion:shadowJar --no-daemon --console=plain
      - name: Test and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\gradlew.bat clean test jar :companion:shadowJar --no-daemon --console=plain
          exit $LASTEXITCODE
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/**
          retention-days: 14
      - name: Save supported JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supported-jars-${{ matrix.os }}
          path: |
            build/libs/osrs-flipping-friend.jar
            companion/build/libs/flipping-friend-companion.jar
          if-no-files-found: error
          retention-days: 14
