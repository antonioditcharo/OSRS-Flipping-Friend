name: CI

# The repository went its whole life to 2 September 2026 with 386 passing tests
# and nothing enforcing them. On 1 September a build failed with 51 compile
# errors and was resolved by deleting five test files. The `guard` job below
# exists specifically so that cannot happen silently again.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The build targets Java 11 bytecode but is developed against JDK 23.
      # Both are installed so a toolchain change cannot silently pass here and
      # fail on the developer machine.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            23

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --console=plain --stacktrace
        shell: bash

      # Test reports are the only way to see which assertion failed once the
      # runner is gone.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  guard:
    name: Deleted-test guard
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on tests deleted without a matching source change
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          deleted=$(git diff --name-only --diff-filter=D "$base" "$head" \
                    | grep -E '(^|/)src/test/.*\.java$|(^|/)test_.*\.py$|.*Test\.java$' || true)

          if [ -z "$deleted" ]; then
            echo "No test files deleted."
            exit 0
          fi

          echo "Test files deleted in this change:"
          echo "$deleted" | sed 's/^/  /'
          echo

          # A deletion is legitimate when the code under test went with it, or
          # when the test was renamed/moved. Anything else is a test being
          # dropped to make a red build green, which is what happened here on
          # 1 September 2026.
          if git log "$base".."$head" --format=%B | grep -qiE '\[remove-tests\]|BREAKING: *tests? removed'; then
            echo "Override marker found in a commit message - allowing."
            exit 0
          fi

          added_or_modified=$(git diff --name-only --diff-filter=AMR "$base" "$head" \
                              | grep -E '\.java$|\.py$' || true)
          if [ -z "$added_or_modified" ]; then
            echo "::error::Test files were deleted and no source file was added or changed."
            echo "::error::If the code under test was removed too, include it in this change."
            echo "::error::To override deliberately, put [remove-tests] in a commit message."
            exit 1
          fi

          echo "Source files also changed:"
          echo "$added_or_modified" | sed 's/^/  /'
          echo
          echo "::warning::Test files were deleted. Confirm each one went with the code it covered."

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Install
        working-directory: dashboard-ui
        run: npm ci
      - name: Build
        working-directory: dashboard-ui
        run: npm run build

  # The ml-forecaster currently has no real tests - its only "test" is a script
  # that prints a prediction, sleeps 15 seconds, asserts nothing and calls the
  # live wiki API. This job installs the dependencies and compiles every module
  # so an import error or syntax error is caught. It gains real teeth when audit
  # item 44 replaces test_ml.py with pytest fixtures.
  ml:
    name: ML forecaster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-forecaster/requirements.txt
      - name: Install
        working-directory: ml-forecaster
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile
        working-directory: ml-forecaster
        run: python -m compileall -q .
      - name: Tests
        working-directory: ml-forecaster
        run: |
          if ls test_*.py tests/ >/dev/null 2>&1 && pip show pytest >/dev/null 2>&1; then
            pytest -q
          else
            echo "No pytest suite yet - see audit item 44."
          fi
