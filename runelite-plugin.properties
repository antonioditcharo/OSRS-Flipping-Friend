# Plugin Hub manifest.
#
# RuneLite's Plugin Hub reads this file from the root of the plugin's repository. Without it the
# plugin can only be side-loaded into ~/.runelite/sideloaded-plugins by hand, which is how this
# project has been run so far and is not something a player will do.
#
# Keys are fixed by the Hub's build; the values are ours. `plugins` names the fully-qualified
# plugin classes, and every one of them must carry @PluginDescriptor or the Hub's build rejects it.
# PluginHubReadinessTest checks that from the other side, so a rename cannot quietly break it.

displayName=Flipping Friend
author=Antonio
description=Live Grand Exchange flipping assistant: what to buy, at what price, and when to sell
tags=grand,exchange,ge,flip,flipping,merch,money,profit,trade
plugins=com.flippingfriend.FlippingFriendPlugin
